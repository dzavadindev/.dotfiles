### MONITORS ###

monitor=HDMI-A-1, 1920x1080@144, 0x0, 1
monitor=eDP-1, 1920x1080@144, 0x0, 1

### MY PROGRAMS ###

$terminal = kitty
$notes = /usr/bin/flatpak run --branch=stable --arch=x86_64 --command=obsidian.sh --file-forwarding md.obsidian.Obsidian @@u %U @@


### AUTOSTART ###

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = hamr
exec-once = quickshell -d 
exec-once = hypridle & otd-daemon &
exec-once = systemctl --user start hyprpolkitagent
exec-once = swww-daemon & swww img "$HOME/Pictures/Wallpapers/alt_wpp1.jpg"

exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

exec-once = [workspace 1 silent] $notes
exec-once = [workspace 2 silent] $terminal

### ON RELOAD ###

execr = pkill quickshell && hyprctl dispatch exec quickshell & disown

### ENVIRONMENT VARIABLES ###

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = GDK_BACKEND,wayland
env = QT_QPA_PLATFORMTHEME,hyprqt6engine

### PERMISSIONS ###

permission = /usr/(bin|local/bin)/flameshot, screencopy, allow
permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
permission = /usr/(bin|local/bin)/hyprpm, plugin, allow

### LOOK AND FEEL ###

general {
    gaps_in = 5
    gaps_out = 5

    border_size = 2

    col.active_border = rgba(e0e1ddFF) rgba(e0e1ddFF) 45deg
    col.inactive_border = none

    resize_on_border = false

    allow_tearing = false

    layout = dwindle
}

cursor {
    no_warps = on
}

decoration {
    rounding = 5
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = on
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = on
        size = 3
        passes = 3

        vibrancy = 0.1696
    }
}

animations {
    enabled = yes

    bezier = easeOutQuint,0.05,0.26,0.41,0.9
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 3.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.9, almostLinear, slide
    animation = workspacesIn, 1, 1.9, almostLinear, slide
    animation = workspacesOut, 1, 1.9, almostLinear, slide
}

# TODO: Maybe change?
dwindle {
    pseudotile = on 
    preserve_split = false
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 1
    disable_hyprland_logo = false

    font_family = 'FiraCode Nerd Font'

    focus_on_activate = on
}

### INPUT ###

input {
    kb_layout = us, ua
    kb_options = ctrl:nocaps, grp:toggle
    repeat_delay = 400

    follow_mouse = 1

    sensitivity = 0

    touchpad {
        disable_while_typing = on
        natural_scroll = false
    }
}

### KEYBINDINGS ###

$mainMod = SUPER

# Apps
bind = $mainMod, T, exec, $terminal
bind = $mainMod, W, exec, hamr toggle
bind = $mainMod, D, exec, discord

# Hamr
bind = $mainMod, Space, exec, hamr plugin wallpaper
bind = $mainMod SHIFT, E, exec, hamr plugin power
bind = $mainMod, V, exec, hamr plugin clipboard

# Hyprland actions
bind = $mainMod, Q, killactive,
bind = $mainMod, O, togglefloating,
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, I, togglesplit, # dwindle
bind = $mainMod, Z, fullscreen, 1

# Lock
bind = $mainMod SHIFT, L, exec, swaylock

# Move focus, swap and resize
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

bind = $mainMod CTRL, h, swapwindow, l
bind = $mainMod CTRL, l, swapwindow, r
bind = $mainMod CTRL, k, swapwindow, u
bind = $mainMod CTRL, j, swapwindow, d

bind = $mainMod SHIFT, l, resizeactive, 25 0
bind = $mainMod SHIFT, h, resizeactive, -25 0
bind = $mainMod SHIFT, k, resizeactive, 0 -25
bind = $mainMod SHIFT, j, resizeactive, 0 25

# Switch workspaces 
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

# Move active window to a workspace 
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

bind = $mainMod SHIFT, S, exec, XDG_CURRENT_DESKTOP=sway flameshot gui

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

### WINDOWS AND WORKSPACES ###

# Screenshotting
windowrule {
    name = flameshot
    match:class = flameshot
    match:title = flameshot

    no_anim = on
    float = on
}

# Ignore maximize requests from apps.
windowrule = suppress_event maximize, match:class *

# Fix some dragging issues with XWayland
windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = on
}

# Enable Shimeji
windowrule {
    name= shimeji
    match:class = com-group_finity-mascot-Main

    float = on
    no_blur = on
    no_focus = on
    no_shadow = on
}

# Fullscreened windows get no border
windowrule = match:fullscreen true, border_size 0

# xwaylandvideobridge setup
windowrule {
    name = xwaylandvideobridge
    match:class = xwaylandvideobridge

    opacity = 0.0
    max_size = 1 1

    no_initial_focus = on
    no_blur = on
    no_focus = on
    no_anim = on
}

# Picture in Picture
windowrule {
    name = picture-in-picture
    match:title = ^Picture-in-Picture|Discord Popup$

    float = on
    pin = on
}
