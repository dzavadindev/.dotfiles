### MONITORS ###

source = ./monitors.conf
monitor = , preferred, auto, 1, mirror, eDP-1 # Mirror any new monitors plugged in

### MY PROGRAMS ###

$terminal = kitty
$file_explorer= dolphin
$notes = /usr/bin/flatpak run --branch=stable --arch=x86_64 --command=obsidian.sh --file-forwarding md.obsidian.Obsidian @@u %U @@
$browser = /home/dan/zen-browser/zen

### AUTOSTART ###

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = hamr &
exec-once = qs -d 
exec-once = hypridle & otd-daemon &
exec-once = systemctl --user start hyprpolkitagent
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = awww-daemon 
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = safeeyes

exec-once = [workspace 1 silent] $browser
exec-once = [workspace 2 silent] discord
exec-once = [workspace 3 silent] $notes

### ON RELOAD ###

execr = pkill qs && hyprctl dispatch exec qs & disown
execr = pkill hamr && hyprctl dispatch exec hamr & disown

### ENVIRONMENT VARIABLES ###

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = GDK_BACKEND,wayland
env = QT_QPA_PLATFORMTHEME,qtengine

### PERMISSIONS ###

permission = /usr/(bin|local/bin)/flameshot, screencopy, allow
permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
permission = /usr/(bin|local/bin)/hyprpm, plugin, allow

### LOOK AND FEEL ###

general {
    gaps_in = 3
    gaps_out = 3

    border_size = 1

    col.active_border = rgba(e0e1ddFF) rgba(e0e1ddFF) 45deg
    col.inactive_border = none

    resize_on_border = false

    allow_tearing = false

    layout = master
}

master {
    new_status = slave
}

cursor {
    no_warps = on
}

decoration {
    rounding = 5
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = on
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = on
        size = 3
        passes = 3

        vibrancy = 0.1696
    }
}

animations {
    enabled = yes

    bezier = easeOutQuint,0.05,0.25,0.40,1
    bezier = easeInOutCubic,0.65,0.05,0.35,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default

    animation = border, 1, 2, easeOutQuint
    animation = windows, 1, 3, easeOutQuint
    animation = windowsIn, 1, 2, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1, linear, popin 87%

    animation = fadeIn, 1, 1, almostLinear
    animation = fadeOut, 1, 1, almostLinear
    animation = fade, 1, 3, quick

    animation = layers, 1, 3, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1, linear, fade

    animation = fadeLayersIn, 1, 1, almostLinear
    animation = fadeLayersOut, 1, 1, almostLinear

    animation = workspaces, 1, 1.5, almostLinear, slide
    animation = workspacesIn, 1, 1.5, almostLinear, slide
    animation = workspacesOut, 1, 1.5, almostLinear, slide
}

misc {
    force_default_wallpaper = 1
    disable_hyprland_logo = false

    font_family = 'FiraCode Nerd Font'

    focus_on_activate = true
}

### INPUT ###

input {
    kb_layout = us, ua
    kb_options = ctrl:nocaps, grp:toggle

    repeat_delay = 400

    follow_mouse = 1

    sensitivity = 0

    touchpad {
        disable_while_typing = on
        natural_scroll = false
    }
}

### KEYBINDINGS ###

$main_mod = SUPER

# Apps
bind = $main_mod, F, exec, $file_explorer
bind = $main_mod, T, exec, $terminal
bind = $main_mod, W, exec, hamr toggle
bind = $main_mod, D, exec, discord

# Quickshell Widgets
bind = $main_mod, Space, exec, qs ipc call overlay togglePanel wallpaper_carousel

# Hamr
bind = $main_mod SHIFT, E, exec, hamr plugin power
bind = $main_mod, V, exec, hamr plugin clipboard

# Hyprland actions
bind = $main_mod, Q, killactive,
bind = $main_mod, O, togglefloating,
bind = $main_mod, P, pseudo, # dwindle
bind = $main_mod, I, togglesplit, # dwindle
bind = $main_mod, Z, fullscreen, 1
bind = $main_mod, Return, fullscreen

# Lock
bind = $main_mod SHIFT, L, exec, swaylock

# Move focus, swap and resize
bind = $main_mod, h, movefocus, l
bind = $main_mod, l, movefocus, r
bind = $main_mod, k, movefocus, u
bind = $main_mod, j, movefocus, d

bind = $main_mod CTRL, h, swapwindow, l
bind = $main_mod CTRL, l, swapwindow, r
bind = $main_mod CTRL, k, swapwindow, u
bind = $main_mod CTRL, j, swapwindow, d

bind = $main_mod SHIFT, l, resizeactive, 25 0
bind = $main_mod SHIFT, h, resizeactive, -25 0
bind = $main_mod SHIFT, k, resizeactive, 0 -25
bind = $main_mod SHIFT, j, resizeactive, 0 25

# Switch workspaces 
bind = $main_mod, 1, workspace, 1
bind = $main_mod, 2, workspace, 2
bind = $main_mod, 3, workspace, 3
bind = $main_mod, 4, workspace, 4
bind = $main_mod, 5, workspace, 5

# Move active window to a workspace 
bind = $main_mod SHIFT, 1, movetoworkspace, 1
bind = $main_mod SHIFT, 2, movetoworkspace, 2
bind = $main_mod SHIFT, 3, movetoworkspace, 3
bind = $main_mod SHIFT, 4, movetoworkspace, 4
bind = $main_mod SHIFT, 5, movetoworkspace, 5

bind = $main_mod SHIFT, S, exec, XDG_CURRENT_DESKTOP=sway flameshot gui

# Move/resize windows with main_mod + LMB/RMB and dragging
bindm = $main_mod, mouse:272, movewindow
bindm = $main_mod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

### WINDOWS AND WORKSPACES ###

# Screenshotting
windowrule {
    name = flameshot
    match:class = flameshot
    match:title = flameshot

    no_anim = on
    float = on
    fullscreen = on
}

# Ignore maximize requests from apps.
windowrule = suppress_event maximize, match:class *

# Fix some dragging issues with XWayland
windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = on
}

# Enable Shimeji
windowrule {
    name= shimeji
    match:class = com-group_finity-mascot-Main

    float = on
    no_blur = on
    no_focus = on
    no_shadow = on
}

# Fullscreened windows get no border
windowrule = match:fullscreen true, border_size 0

# xwaylandvideobridge setup
windowrule {
    name = xwaylandvideobridge
    match:class = xwaylandvideobridge

    opacity = 0.0
    max_size = 1 1

    no_initial_focus = on
    no_blur = on
    no_focus = on
    no_anim = on
}

# Picture in Picture
windowrule {
    name = picture-in-picture1
    match:title = Picture-in-Picture
    match:class = zen

    float = on
    pin = on
    size=  436 245
    move = 1476 791
}

windowrule {
    name = picture-in-picture2
    match:initial_title = Discord Popout

    float = on
    pin = on
}

# KdenLive source select window
windowrule {
    name = kdenlive-sources
    match:title = Kdenlive
    match:float = on

    move = 466 215
    size = 990 600
}

# Steam notifications
windowrule {
    name = steam-notifications
    match:title = ^notificationtoast\_.*\_desktop$
    match:class = steam

    pin = on
}

# Terraria tModLoader
windowrule {
    name = tmodloader
    match:title = ^Terraria.*$
    match:class = dotnet

    fullscreen = on
}

# Hyprland Share Picker
windowrule {
    name = hyprland-share-picker
    match:title = kdenlive-sources

    move = 679 287
	size = 359 459
}

# Godot 
windowrule {
    name = godot
    match:class = Godot

    focus_on_activate = on
}

windowrule {
    name = godot-game
    match:title = ^.*DEBUG.*$

    float = on
    size = 1600 900
}

# Meld
windowrule {
    name = meld
    match:title = org.gnome.Meld

    maximize = on
}
