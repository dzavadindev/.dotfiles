font_family      family='FiraCode Nerd Font' style=Regular
bold_font        family='FiraCode Nerd Font' style=Bold
italic_font      family='FiraCode Nerd Font' style=Light
bold_italic_font family='FiraCode Nerd Font' style=SemiBold

font_size 13.0
background_opacity 0.75
background_blur 1

window_padding_width 8

# BEGIN_KITTY_THEME
# Gruvbox Dark
include current-theme.conf
# END_KITTY_THEME

confirm_os_window_close 0
copy_on_select yes

clear_all_shortcuts yes

map alt+k scroll_line_up
map alt+j scroll_line_down

map ctrl+shift+equal change_font_size all +2.0
map ctrl+shift+plus change_font_size all +2.0
map ctrl+shift+minus change_font_size all -2.0

map ctrl+shift+c combine : copy_to_clipboard : clear_selection
map ctrl+shift+v paste_from_clipboard
